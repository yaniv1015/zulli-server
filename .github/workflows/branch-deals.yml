name: Branch deals

# Deals that run only in some branches (a city, a region): reads every store's deal file and keeps what differs
# from the chain-wide deals of the latest price run. Output: data/bd/NN.json on the "bd" branch.
on:
  schedule:
    - cron: '53 3 * * *'   # daily, after the night's price runs
  workflow_dispatch:
    inputs:
      chains:
        description: 'only these chains (comma separated), empty = all'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: branch-deals
  cancel-in-progress: false

jobs:
  deals:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node test/run.js
      - name: The latest prices (base price of every product in every branch)
        run: |
          git fetch --depth 1 origin data
          mkdir -p data && git show origin/data:data/summary.json > data/summary.json
          git archive origin/data data/br | tar -x
          ls data/br | wc -l
      - name: Read every branch's deal file
        timeout-minutes: 310
        env:
          NODE_OPTIONS: --max-old-space-size=12288
          CHAIN_MINUTES: '11'
          CHAINS: ${{ inputs.chains }}
          CHAIN_MINUTES_shufersal: '40'
          PARALLEL: '4'
          PARALLEL_shufersal: '2'   # its deal files are very large
        run: |
          set -o pipefail
          # the chain list comes from the person who started the run: passed as data, never pasted into the command
          ARGS=""
          if [ -n "$CHAINS" ]; then
            if ! printf '%s' "$CHAINS" | grep -Eq '^[a-z0-9]+(,[a-z0-9]+)*$'; then echo "bad chains list"; exit 1; fi
            ARGS="--chains=$CHAINS"
            # a partial run merges into the last published output instead of replacing it
            git fetch --depth 1 origin bd && mkdir -p prev && git archive FETCH_HEAD data/bd | tar -x -C prev && export PREV_DIR=prev/data/bd || true
          fi
          mkdir -p data/bd
          node --trace-uncaught src/branchdeals.js $ARGS 2>&1 | tee data/bd/log.txt
      - name: Publish to the "bd" branch
        if: success() || failure()
        run: |
          test -f data/bd/report.json || exit 0
          git config user.name "zulli-bot"
          git config user.email "bot@users.noreply.github.com"
          git checkout --orphan bd-tmp
          git rm -rf --cached . > /dev/null
          git add -f data/bd
          git commit -m "branch deals $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f origin bd-tmp:bd
