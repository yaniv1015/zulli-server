name: Street and branch locations

on:
  workflow_dispatch: {}
  schedule:
    - cron: '41 2 1 * *'   # monthly: new branches get a location

permissions:
  contents: write

jobs:
  geo:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install osmium shapely
      - name: OpenStreetMap extract and the latest branch list
        run: |
          curl -sSL -o israel.osm.pbf https://download.geofabrik.de/asia/israel-and-palestine-latest.osm.pbf
          git fetch --depth 1 origin data
          git show origin/data:data/summary.json > summary.json
      - run: python tools/geo.py israel.osm.pbf summary.json data
      - name: Publish to the "geo" branch
        run: |
          git config user.name "zulli-bot"
          git config user.email "bot@users.noreply.github.com"
          git checkout --orphan geo-tmp
          git rm -rf --cached . > /dev/null
          git add -f data/geo data/storegeo.json
          git commit -m "geo $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f origin geo-tmp:geo
