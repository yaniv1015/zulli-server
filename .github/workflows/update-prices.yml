name: Update prices

on:
  schedule:
    - cron: '17 */3 * * *'   # every 3 hours
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: prices
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node test/run.js
      - name: Get the previous summary (kept for chains that come back short)
        run: |
          git fetch --depth 1 origin data || true
          mkdir -p data && (git show origin/data:data/summary.json > data/prev.json || rm -f data/prev.json)
      - name: Fetch price files
        id: fetch
        timeout-minutes: 170
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: node src/fetch.js
      - name: Publish data to the "data" branch
        if: success() || failure()   # not when cancelled
        run: |
          git config user.name "zulli-bot"
          git config user.email "bot@users.noreply.github.com"
          git checkout --orphan data-tmp
          git rm -rf --cached . > /dev/null
          test -f data/summary.json || exit 0
          git add -f data/summary.json data/report.json; test -d data/br && git add -f data/br || true
          git commit -m "prices $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f origin data-tmp:data
      - name: Tell the owner if something went wrong
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_OUTCOME: ${{ steps.fetch.outcome }}
        run: node tools/health.js || true
