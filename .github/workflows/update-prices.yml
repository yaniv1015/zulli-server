name: Update prices

on:
  schedule:
    - cron: '17 */3 * * *'   # every 3 hours
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node test/run.js
      - name: Fetch price files
        run: node src/fetch.js --online-only
      - name: Publish data to the "data" branch
        run: |
          git config user.name "zulli-bot"
          git config user.email "bot@users.noreply.github.com"
          git checkout --orphan data-tmp
          git rm -rf --cached . > /dev/null
          git add -f data/summary.json data/report.json
          git commit -m "prices $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f origin data-tmp:data
