name: Android app

# Builds the Android app (a test build anyone can install) and attaches it to the "android-test" release.
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ['app/zul-li.html', 'mobile/**', '.github/workflows/android.yml']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm install --no-audit --no-fund
      - run: npm run www
      - run: npx cap add android
      - name: Permissions (camera for barcodes, location for the nearest branch) and the version
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />#' $M
          grep -c CAMERA $M
          sed -i "s/versionCode 1/versionCode ${GITHUB_RUN_NUMBER}/; s/versionName \"1.0\"/versionName \"0.1.${GITHUB_RUN_NUMBER}\"/" android/app/build.gradle
      - name: Icon and splash (mobile/assets)
        run: npx --yes @capacitor/assets@3.0.5 generate --android --iconBackgroundColor '#D7FF1F' --iconBackgroundColorDark '#D7FF1F' --splashBackgroundColor '#0B0B0F' --splashBackgroundColorDark '#0B0B0F'
      - run: npx cap sync android
      - name: Build
        working-directory: mobile/android
        run: ./gradlew --no-daemon assembleDebug
      - name: Publish to the android-test release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk mozil.apk
          gh release view android-test >/dev/null 2>&1 || gh release create android-test --prerelease --title "מוזיל · גרסת בדיקה לאנדרואיד" --notes "קובץ התקנה לבדיקה. בטלפון: הורד את mozil.apk ואשר התקנה ממקור לא ידוע."
          gh release upload android-test mozil.apk --clobber
          gh release edit android-test --title "מוזיל · גרסת בדיקה לאנדרואיד" --notes "קובץ התקנה לבדיקה. בטלפון: הורד את mozil.apk ואשר התקנה ממקור לא ידוע."
          gh release delete-asset android-test zulli.apk -y 2>/dev/null || true
