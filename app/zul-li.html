  const need=words.length>=3?words.length-1:words.length;/* a long query may have one word no product has */
  const cnt=new Map();for(const m of per)for(const i of m.keys())cnt.set(i,(cnt.get(i)||0)+1);
  const full=[...cnt].filter(([,c])=>c===words.length).map(([i])=>i);
  const pool=full.length>=3||need===words.length?full:[...cnt].filter(([,c])=>c>=need).map(([i])=>i);
  const nq=sxCanon(raw),w0=words[0];const out=[];
  for(const i of pool){const v=V[i];let s=0;for(const m of per)s+=m.get(i)||0;
    const nm=sxCanon(v.n),nt=nm.split(' ').length,sold=v.rp?(fids?fids.filter(c=>v.rp[c]!=null).length:Object.keys(v.rp).length):0;
    if(needSold&&!sold)continue;
    s-=(words.length-(cnt.get(i)||0))*3;            // a missing word costs
    if(nm.startsWith(w0))s+=3;                       // the name starts with the first word ("במבה", not "חטיף בטעם במבה")
    if(nm.includes(nq))s+=3;                         // the words in the same order
    if(sxTokens(TYPES[v.t][0]).some(x=>sxStem(x)===sxStem(w0)||x.startsWith(w0)))s+=2; // the product kind matches ("ביצה" → eggs)
    s+=4*Math.min(1,(cnt.get(i)||0)/nt);              // the query covers most of the name: the plain product, not a variant
    s+=Math.min(sold,8)*0.8;                         // sold in many chains: the product people usually mean
    s-=nm.length/60;                                 // shorter names are the plain product
    out.push({v,score:s})}
  return out.sort((a,b)=>b.score-a.score).slice(0,limit)}

/* ================= shelves: the order of a typical Israeli supermarket =================
   (patterns run on norm(name): no quotes, and final letters written as regular ones) */
/* produce words must start a word ("קרפרי" is not fruit, "גזרה" is not carrots) */
const SHELVES=[['produce','🥬 ירקות ופירות',/(?<=\s[והבל]?)(?:ירק|פירות|פרי |עגבני|מלפפונ|בננ|תפוח|בצל|גזר|חסה|פלפל|לימונ|אבוקדו|תפוז|ענב|אבטיח|מלונ|שומ |פטרוזיליה|כוסברה|שמיר|נענע)/],
  ['bakery','🍞 לחם ומאפים',/לחמ|לחמני|פית|חלה|באגט|מאפה|בורקס|קרואסונ|עוגה|עוגת|עוגות|טורטיה|לאפה/],
  ['dairy','🥛 חלב, גבינות וביצים',/חלב|גבינ|קוטג|יוגורט|יוגרט|שמנת|לבנ|חמאה|מעדנ|ביצ|מילקי|דנונה|יופלה|שוקו/],
  ['meat','🍗 בשר, עוף ודגים',/בשר|עופ|חזה|שניצל|כבד|נקניק|קבב|המבורגר|דג |דגי|סלמונ|טונה|פרגית|כרעיימ|כנפיימ|סטייק|אנטריקוט|קציצ/],
  ['frozen','🧊 קפואים',/קפוא|מוקפא|גלידה|שלגונ|ארטיק/],
  ['pantry','🥫 מזווה ויבשים',/אורז|פסטה|קמח|סוכר|שמנ|קטניות|עדשימ|שעועית|חומוס|טחינה|רוטב|רסק|שימורי|קפה|תה |דגני|קוואקר|ריבה|דבש|תבלינ|מלח|אטריות|פתיתימ|קוסקוס|שקדי מרק/],
  ['snacks','🍫 חטיפים ומתוקים',/חטיפ|במבה|ביסלי|ציפס|דוריטוס|שוקולד|עוגיות|ופל|סוכריות|מסטיק|קרקר|בייגלה|פופקורנ/],
  ['drink','🥤 שתייה',/מימ |מימ$|משקה|מיצ|קולה|ספרייט|פנטה|סודה|בירה|יינ|נקטר|תרכיז|פריגת|אנרגיה/],
  ['baby','👶 תינוקות',/חיתול|מגבונ|מטרנה|סימילאק|תמל|האגיס|פמפרס|בייבי/],
  ['care','🧴 טיפוח ופארם',/שמפו|מרככ שיער|סבונ|דאודורנט|משחת שיניימ|מברשת שיניימ|קרמ |תחליב|גילוח|טמפונ|תחבושות|צמר גפנ|מגנ תחתונ|מגני תחתונ|פדימ|קרפרי|אולוויז/],
  ['home','🧽 ניקיון ובית',/כביסה|אקונומיקה|נוזל כלימ|מנקה|ניקוי|טואלט|מגבות נייר|שקיות|אלומיניומ|ניילונ|ספוג|אשפה|מטהר|כפית|כפיות|מזלג|צלחות|כוסות חד/],
  ['other','🛒 שונות',/$^/]];
const CAT_SHELF={produce:'produce',bakery:'bakery',dairy:'dairy',meat:'meat',pantry:'pantry',drink:'drink',home:'home',baby:'baby'};
function shelfOf(it){const v=it.v?VB[it.v]:null;const cat=TYPES[it.t]?.[2];
  const name=' '+norm(v?v.n:(TYPES[it.t]?.[0]||''))+' ';
  if(/קפוא|מוקפא|גלידה|גלידות|שלגונ|ארטיק/.test(name))return 'frozen';
  if(it.t!=='other'&&cat&&CAT_SHELF[cat]){/* a known kind; snacks and sweets typed as pantry get their own shelf */
    if(cat==='pantry'&&SHELVES.find(x=>x[0]==='snacks')[2].test(name))return 'snacks';
    if(cat==='home'&&SHELVES.find(x=>x[0]==='care')[2].test(name))return 'care';return CAT_SHELF[cat]}
  /* the specific shelves are checked first: "שמן גזר" sunscreen is pharmacy, not carrots */
  for(const id of ['care','baby','home','snacks','drink','dairy','meat','bakery','pantry','produce']){const rx=SHELVES[SHELF_IX[id]][2];if(rx.test(name))return id}
  return 'other'}
const SHELF_IX=Object.fromEntries(SHELVES.map((a,i)=>[a[0],i]));
const shelfName=id=>(SHELVES.find(a=>a[0]===id)||SHELVES[SHELVES.length-1])[1];
function byShelf(items){return items.map((it,i)=>({it,i,a:shelfOf(it)})).sort((x,y)=>SHELF_IX[x.a]-SHELF_IX[y.a]||x.i-y.i)}

/* ================= monthly budget: what the saved purchases of this month cost ================= */
function monthSpent(){const now=new Date(),m=now.getMonth(),y=now.getFullYear();
  return (state.orders||[]).filter(o=>{const d=new Date(o.ts);return d.getMonth()===m&&d.getFullYear()===y}).reduce((a,o)=>a+(+o.total||0),0)}
const MONTHS_HE=['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];
function budgetHtml(listCost){const B=+state.budget||0;if(!B)return'';const spent=monthSpent(),left=B-spent,after=left-(listCost||0);

  return `<section class="card budget${over?' over':''}" aria-label="תקציב חודשי"><div class="row2 spread"><b>💰 תקציב ${MONTHS_HE[new Date().getMonth()]}</b><button class="link" type="button" id="budgetEdit">שנה</button></div>

function openBudget(){openSheet('💰 תקציב חודשי לסופר',`<p class="sub">כמה אתה רוצה להוציא בסופר בחודש? נחשב לפי הקניות וההזמנות ששמרת באפליקציה, ונראה לפני כל קנייה כמה יישאר.</p>
    <label class="f" for="budgetIn">תקציב לחודש (₪)</label><input type="number" id="budgetIn" inputmode="numeric" min="0" step="50" value="${+state.budget||''}" placeholder="למשל 3000">
    <button class="btn big" type="button" id="budgetSave">שמור</button>${state.budget?'<button class="link danger" type="button" id="budgetOff">בטל תקציב</button>':''}`,body=>{
    $('budgetSave').onclick=()=>{const n=Math.round(+$('budgetIn').value);if(!(n>0)){toast('כתוב סכום');$('budgetIn').focus();return}state.budget=n;closeSheet();update();toast(`התקציב נשמר: ${fmt(n)} לחודש`)};
    if($('budgetOff'))$('budgetOff').onclick=()=>{state.budget=0;closeSheet();update()};setTimeout(()=>$('budgetIn')?.focus(),50)})}

/* ================= voice: say the list ("חלב, עגבניות ולחם") ================= */
function voiceToList(text){/* "עגבניות ולחם" → two products; "וופל"/"ויטמין" stay whole */
  try{sxIndex()}catch(e){}const known=w=>{const t=sxCanon(w);return !!(SX.voc&&SX.voc.has(t))};
  return String(text||'').replace(/\s+(ו|וגם)\s+/g,', ').replace(/\s+ו([א-ת]{2,})/g,(m,rest)=>/* split "ולחם" unless "ו…" is itself a word ("וופל") */known('ו'+rest)&&!known(rest)?m:', '+rest).replace(/(^|\s)(וגם|גם|בבקשה|תוסיף|להוסיף|צריך|צריכים|תרשום)(?=\s|$)/g,' ').trim()}
let _rec=null;
function startVoice(btn){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  const fallback=why=>{openPaste();setTimeout(()=>{const u=$('paste');if(u)u.insertAdjacentHTML('beforebegin',`<p class="okline">🎤 ${why} אפשר ללחוץ על המיקרופון במקלדת של הטלפון ולהכתיב את הרשימה כאן, ואז "הוסף לרשימה".</p>`)},60)};
  if(!SR)return fallback('הדפדפן הזה לא מאפשר הכתבה בתוך האפליקציה.');
  if(_rec){try{_rec.stop()}catch(e){}return}
  const r=new SR();_rec=r;r.lang='he-IL';r.interimResults=true;r.continuous=false;r.maxAlternatives=1;let final='',got=false;
  btn.classList.add('on');btn.setAttribute('aria-pressed','true');toast('🎤 מקשיב… אמור את המוצרים');
  r.onresult=e=>{let t='';for(const x of e.results)t+=x[0].transcript;final=t;got=true;const q=$('q');if(q)q.value=t};
  r.onerror=e=>{_rec=null;btn.classList.remove('on');if(e.error==='not-allowed'||e.error==='service-not-allowed')fallback('אין גישה למיקרופון כאן.');else if(e.error==='no-speech')toast('לא שמעתי. נסה שוב')};
  r.onend=()=>{_rec=null;btn.classList.remove('on');btn.setAttribute('aria-pressed','false');if(!got||!final.trim())return;
    const{out,unknown}=parseList(voiceToList(final));const q=$('q');if(q)q.value='';
    if(!out.length){toast(`לא זיהיתי מוצרים ב"${final}"`);return}
    addItems(out,'מהקול');update();toast(`🎤 נוספו ${nOf(out.length,'מוצר אחד','מוצרים')}${unknown.length?` · לא זוהה: ${unknown.join(', ')}`:''}`)};
  try{r.start()}catch(e){_rec=null;btn.classList.remove('on');fallback('לא הצלחתי להפעיל את המיקרופון.')}}

/* an ingredient name → a list item: the generic kind when the name is just the kind ("עגבניות", "ביצים"),
   otherwise the best matching product sold in your chains ("רסק עגבניות" is tomato paste, not tomatoes) */
function recipeItem(name,fresh){const p=parseList(name).out[0]||null;const nk=sxTokens(name).join(' ');
  if(p&&!p.v&&sxTokens(TYPES[p.t][0]).join(' ')===nk)return{...p};
  const fids=followed().map(c=>c.id),words=sxTokens(name);
  const fits=v=>{const ts=sxTokens(v.n);return words.every(w=>ts.some(t=>sxWordScore(w,t)>=3))};
  const cands=findProducts(name,{fids,limit:20}).filter(x=>x.v.rp&&fids.some(c=>x.v.rp[c]!=null)&&fits(x.v)).map(x=>x.v);
  /* produce bought by weight: the fresh one ("פלפל אדום" by the kilo, not dried pepper) */
  const v=(fresh&&cands.find(v=>v.weighted))||cands.find(v=>!/יבש|אבקה|טחונ|זרעי/.test(norm(v.n))||/יבש|אבקה|טחונ|זרעי/.test(norm(name)))||cands[0];
  if(v)return{t:v.t,v:v.id,q:1};
  return p?{...p}:null}

/* ================= AI: which ingredients a recipe video needs =================
   Claude takes images, not video: a few frames spread over the clip go with the title. What is cooked on camera
   (and any text on screen) is usually enough; what is only said aloud is not heard. */
function videoFrames(src,n=8){return new Promise((res,rej)=>{const v=document.createElement('video');v.muted=true;v.playsInline=true;v.preload='auto';v.src=src;
  const out=[];let i=0,times=[];const done=()=>{clearTimeout(tm);v.removeAttribute('src');v.load();out.length?res(out):rej(new Error('frames'))};
  const tm=setTimeout(done,25000);
  v.onerror=()=>{clearTimeout(tm);rej(new Error('video'))};
  v.onloadedmetadata=()=>{const d=isFinite(v.duration)&&v.duration>0?v.duration:10;times=Array.from({length:n},(_,k)=>d*(0.05+0.9*k/Math.max(1,n-1)));v.currentTime=times[0]};
  v.onseeked=()=>{try{const w=v.videoWidth,h=v.videoHeight;if(w&&h){const sc=Math.min(1,768/Math.max(w,h));const c=document.createElement('canvas');c.width=Math.round(w*sc);c.height=Math.round(h*sc);
      c.getContext('2d').drawImage(v,0,0,c.width,c.height);c.toBlob(b=>{if(b)out.push(b);next()},'image/jpeg',0.75)}else next()}catch(e){next()}};
  const next=()=>{i++;if(i<times.length)v.currentTime=times[i];else done()}})}
async function aiVideoIngredients(src,title,signal){
  if(!SAMPLE||!CAN_IMG)throw{code:'unavailable'};
  const lim=await SAMPLE.limits().catch(()=>null);const n=Math.max(1,Math.min(8,lim?.images?.maxCount||6));
  const frames=await videoFrames(src,n);
  const r=await SAMPLE.json(`The images are ${frames.length} frames, in order, from a short cooking video${title?` titled "${String(title).replace(/"/g,"'").slice(0,80)}"`:''}. The viewer is in Israel and wants to buy what this recipe needs.
Look at what is prepared on screen, the packages and ingredients shown, and any text or captions in the frames. Use the title too.
If the frames do not show cooking or food, reply {"ok": false}.
Otherwise list the ingredients needed to make this dish, in Hebrew, as they are called on Israeli supermarket shelves (plain and generic, e.g. "עגבניות", "חזה עוף", "שמנת מתוקה", "פסטה פנה"). Include the obvious basics of the dish even if a frame does not show them, but do not invent unusual ones.
For each: name, amount (Hebrew, a rough amount if you can tell, else ""), seen (true if it is visible in a frame), pantry (true for salt, pepper, oil, sugar, flour, common spices, water).
Also give dish (the dish name in Hebrew) and note (one short Hebrew sentence on how sure you are).
Reply with only JSON: {"ok": true, "dish": string, "note": string, "ingredients": [{"name": string, "amount": string, "seen": boolean, "pantry": boolean}]}`,{images:frames,signal,modelTier:'default'});
  if(!r||r.ok===false||!Array.isArray(r.ingredients)||!r.ingredients.length)throw{code:'nofood'};
  return{dish:String(r.dish||title||'').slice(0,60),note:String(r.note||'').slice(0,160),ingredients:r.ingredients.filter(x=>x&&String(x.name||'').trim()).slice(0,30).map(x=>({name:String(x.name).trim().slice(0,60),amount:String(x.amount||'').slice(0,30),seen:!!x.seen,pantry:!!x.pantry}))}}
const aiErr=c=>c==='unavailable'?'זיהוי מצרכים מסרטון עובד כשהאפליקציה פתוחה בתוך Claude.':c==='nofood'?'לא זיהינו מתכון בסרטון. אפשר לכתוב את המצרכים ידנית.':c==='frames'||c==='video'?'לא הצלחנו לקרוא את הסרטון. נסה סרטון MP4.':errText(c);
/* the ingredients of a video as a checklist to add to the shopping list */
function openIngrSheet(res,onSave){const rows=res.ingredients.map(x=>{const item=qtyFor(recipeItem(x.name,!/יבש|אבקה|טחונ|גרגרי|שקית|קופס|שימור/.test(norm(x.name+' '+(x.amount||'')))),x.amount);return{...x,item,on:!!item&&!x.pantry}});
  const draw=body=>{const n=rows.filter(r=>r.on&&r.item).length;
    body.innerHTML=`<p class="sub">${res.written?'המצרכים כפי שכתב מי שהעלה את הסרטון. סמן מה צריך לקנות.':esc(res.note||'')+' המצרכים הם הערכה של Claude לפי הסרטון. עבור עליהם לפני הקנייה.'}</p>
      <div class="rcp">${rows.map((r,i)=>`<label class="ri${r.item?'':' miss'}"><input type="checkbox" data-ri="${i}" ${r.on?'checked':''} ${r.item?'':'disabled'}><span class="grow"><b>${esc(r.name)}</b> <span class="sub">${esc(r.amount)}</span>${r.item&&r.item.q&&r.item.q!==1?` <span class="pill">${isKg(r.item)?r.item.q+' ק״ג':'× '+r.item.q}</span>`:''}<br><small class="sub">${r.seen?'👁️ נראה בסרטון · ':''}${r.item?(r.item.v?'במחירון: '+esc(vLabel(VB[r.item.v])):'הזול מסוג '+esc(TYPES[r.item.t][0])):'לא נמצא במחירון'}${r.pantry?' · בדרך כלל יש בבית':''}</small></span></label>`).join('')}</div>
      <button class="btn y big" type="button" id="igAdd" ${n?'':'disabled'}>➕ הוסף ${nOf(n,'מוצר אחד','מוצרים')} לרשימה</button>

/* a video that stalls or fails says so, with a retry from the same point */
function watchVideo(v){if(v._watched)return;v._watched=true;const msg=v.parentElement?.querySelector('.vmsg');let tm=0;
  const show=(t,retry)=>{if(!msg)return;msg.hidden=false;msg.innerHTML=t+(retry?' <button class="link" type="button">נסה שוב</button>':'');const b=msg.querySelector('button');if(b)b.onclick=()=>{const at=v.currentTime||0;msg.hidden=true;v.load();v.currentTime=at;v.play().catch(()=>{})}};
  const hide=()=>{clearTimeout(tm);if(msg)msg.hidden=true};
  v.addEventListener('waiting',()=>{clearTimeout(tm);tm=setTimeout(()=>show('⏳ הסרטון נטען…',true),4000)});
  v.addEventListener('stalled',()=>{clearTimeout(tm);tm=setTimeout(()=>show('⏳ החיבור איטי, הסרטון נעצר.',true),6000)});
  ['playing','canplay','seeked'].forEach(e=>v.addEventListener(e,hide));
  v.addEventListener('error',()=>show(v.error&&v.error.code===4?'⚠️ הטלפון לא מצליח לנגן את הקובץ הזה (פורמט לא נתמך).':'⚠️ לא הצלחנו לטעון את הסרטון.',v.error?.code!==4));
  /* only one video plays at a time */
  v.addEventListener('play',()=>document.querySelectorAll('video[data-vk]').forEach(o=>{if(o!==v&&!o.paused)o.pause()}))}

/* ---- ingredients with amounts → list items with quantities ---- */
function splitIngr(line){const m=String(line).trim().match(/^(.*?)[\s\-–:]+((?:\d+(?:[.,]\d+)?|חצי|רבע)\s*(?:ק["״']?ג|קילו|גרם|גר['׳]?|ג['׳]|מ["״]?ל|ליטר|ל['׳]|יח(?:ידות|['׳])?|כוס(?:ות)?|כפ(?:ות|ית|יות)?|שקית|שקיות|חבילה|חבילות|קופסה|קופסאות|פחית|פחיות)?)\s*$/);
  return m&&m[1].trim()?{name:m[1].trim(),amount:m[2].trim()}:{name:String(line).trim(),amount:''}}
function qtyFor(item,amount){const a=String(amount||'').replace(',','.').trim();if(!item||!a)return item;const it={...item};
  const n=/^חצי/.test(a)?0.5:/^רבע/.test(a)?0.25:parseFloat(a);if(!(n>0))return it;
  const kg=isKg(it);
  if(kg){if(/ק["״']?ג|קילו/.test(a))it.q=Math.max(.5,Math.round(n*2)/2);else if(/גרם|גר|ג['׳]/.test(a))it.q=Math.max(.5,Math.round(n/1000*2)/2);
    else if(/^\d+(\.\d+)?$/.test(a)||/יח/.test(a))it.q=Math.max(.5,Math.round(n*0.2*2)/2);/* about 200 g a piece: "2 פלפלים" ≈ half a kilo */return it}
  if(/כוס|כפ/.test(a)||n>12)return it;/* a spoon or a cup of something is one package */
  if(/שקית|שקיות|חבילה|חבילות|קופסה|קופסאות|פחית|פחיות/.test(a)){it.q=Math.max(1,Math.round(n));return it}/* packages: as written */
  const v=it.v?VB[it.v]:null;/* a bare count ("ביצים 6") is units of the product only when it is sold one by one */
  if(v&&(/^1 יח/.test(v.s||'')||!v.s)&&(/^\d+(\.\d+)?$/.test(a)||/יח/.test(a)))it.q=Math.max(1,Math.round(n));
  return it}

/* match a free-text description ("שמפו פנטן לשיער יבש 500 מ״ל") to the catalog: type by keyword, then brand, words and size */
function matchDesc(desc){
  const clean=norm(String(desc));const hit=KW.find(({k})=>clean.includes(k));if(!hit)return null;
  const words=new Set(clean.split(/[\s,.\-/]+/).filter(w=>w.length>=2||/[a-z]/.test(w)));const nums=clean.match(/\d+(?:\.\d+)?/g)||[];
  let best=null,bs=-1;const typeWords=new Set([TYPES[hit.t][0],...TYPES[hit.t][3]].flatMap(x=>norm(x).split(/\s+/)));
  for(const v of ofType(hit.t)){
    if(v.own&&!clean.includes(norm(v.b)))continue;
    let sc=0;const bw=norm(v.b).split(/\s+/).filter(Boolean);
    if(bw.length&&bw.every(w=>words.has(w)||clean.includes(w)))sc+=5;
    for(const w of norm(v.n).split(/\s+/))if((w.length>=2||/[a-z]/.test(w))&&words.has(w)&&!typeWords.has(w))sc+=2;
    const sn=v.s.match(/\d+(?:\.\d+)?/g)||[];if(sn.length&&sn.every(x=>nums.includes(x)))sc+=2;
    if(norm(v.n).startsWith(hit.k))sc+=2;if(v.weighted&&/לק[״"]?ג|קילו/.test(desc))sc+=3;
    if(sc>bs||(sc===bs&&v.base<best.base)){bs=sc;best=v}

}

    c.width=Math.max(1,Math.round(img.naturalWidth*sc));c.height=Math.max(1,Math.round(img.naturalHeight*sc));c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);
    c.toBlob(b=>b?res(b):rej(new Error('encode')),'image/jpeg',0.85)}catch(e){URL.revokeObjectURL(url);rej(e)}};
  img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('decode'))};img.src=url})}

function priceRows(v,fol=followed()){

    const pr=promoAt(c.id,v.id);let unit=null;
    if(pr){unit=pr.kind==='multi'?pr.price/pr.n:pr.kind==='fixed'?pr.price:pr.kind==='pct'?p*(1-pr.pct):pr.kind==='second'?p*.75:pr.kind==='club'?p*(1-pr.pct):null;if(unit!=null&&unit>=p)unit=null}

/* one product in every branch of one city: the branch's own shelf price (br/NN.json) and the branch's deals

async function cityPriceRows(v,city){const bc=v.id.slice(1);const rows=[];
  for(const c of CH){const bs=branchesOf(c,city).filter(b=>b.id);if(!bs.length)continue;await ensureChain(c.id);const V2=VB[v.id];if(!V2||!V2.rp||V2.rp[c.id]==null)continue;
    for(const b of bs){const own=await brData(c,b);const p=own&&own[bc]!=null?own[bc]:V2.rp[c.id];const e=await bdData(c,b);const dd=dealsAt(c.id,V2,e);
      const member=state.clubs.includes(c.id);let best=null;
      for(const [d,isOwn] of [[dd[0],dd.ownR],[dd[1],dd.ownC]]){const pr=realDeal(d,c.id);if(!pr)continue;const unit=pr.kind==='multi'?pr.price/pr.n:pr.kind==='fixed'?pr.price:pr.kind==='pct'?p*(1-pr.pct):null;if(unit==null||unit>=p)continue;
        const usable=!pr.club||member;const cand={pr,unit,usable,own:isOwn};if(!best||(usable&&!best.usable)||(usable===best.usable&&unit<best.unit))best=cand}
      const lost=!!(e&&((V2.rd&&V2.rd[c.id]&&e.x.has(bc))||(V2.rdc&&V2.rdc[c.id]&&e.xc.has(bc))));
      rows.push({c,b,p,ownPrice:!!own,deal:best,best:best&&best.usable?best.unit:p,lost})}}

    const pm=line.match(/(-?\d{1,4}[.,]\d{2})\s*-?\s*$/)||line.match(/^\s*(-?\d{1,4}[.,]\d{2})\s/);if(!pm)continue;const price=parseFloat(pm[1].replace(',','.'));
    if(/סה["״]?כ|לתשלום|סך הכל/.test(line)){if(price>0&&(!total||price>total))total=price;continue}
    if(SKIP.test(line)||!(price>0))continue;
    let name=line.replace(pm[0],' ');const qm=name.match(/(\d{1,2})\s*[xX×*]\s*\d{1,4}[.,]\d{2}/)||name.match(/\d{1,4}[.,]\d{2}\s*[xX×*]\s*(\d{1,2})/);const qty=qm?+qm[1]:1;if(qm)name=name.replace(qm[0],' ');
    const bc=(name.match(/\b(\d{7,13})\b/)||[])[1];name=name.replace(/\b\d{5,13}\b/g,' ').replace(/[\d.,]+\s*(?=$)/,'').replace(/\s+/g,' ').trim();
    if(!/[\u0590-\u05FF]{2}/.test(name))continue;const match=bc&&VB['r'+bc]?'r'+bc:null;items.push({name,qty,paid:price,match})}
  return {store:null,date:null,total,items}}
function openReceipt(){

/* ================= "בוא נדייק": choose size, then product, for items added without one =================
   Sizes in the price files are messy ("1.98 ליטר" is a 6-pack of cans), so options are grouped by
   container kind (single can, multipack) plus the printed size. */
function sizeKey(v){const s=v.s||'';if(!s||/^1 יח/.test(s))return '';const n=v.n||'';
  if(/מארז|שישי|רביעי|\d\s*[*×xX]\s*\d|\d\s*יח(?:ידות|׳|')?\b|פחיות/.test(n))return 'מארז · '+s;
  if(/פחית/.test(n))return 'פחית '+s;return s}
function sizeGroups(t,brand){const g=new Map();
  for(const v of ofType(t)){if(!allowed(v)||(brand&&v.b!==brand))continue;const k=sizeKey(v);if(!k)continue;const ch=cheapestOf(v.id);if(!ch)continue;
    const x=g.get(k)||{k,n:0,min:Infinity};x.n++;x.min=Math.min(x.min,ch.p);g.set(k,x)}
  const fam=k=>/גרם|ק״ג/.test(k)?'w':/ליטר|מ״ל/.test(k)?'v':'o';const tot={w:0,v:0,o:0};for(const x of g.values())tot[fam(x.k)]+=x.n;
  const main=tot.w>tot.v?'w':'v';
  return [...g.values()].filter(x=>(fam(x.k)===main||fam(x.k)==='o')&&(x.n>=2||g.size<=6)).sort((a,b)=>b.n-a.n).slice(0,6)}
function refineQueue(keys){const q=state.items.filter(i=>!i.v&&(!keys||keys.includes(i.k))&&ofType(i.t).length>1&&!isKg(i)).map(i=>i.k); /* fresh produce needs no size or brand */if(q.length)openRefine(q)}
function openRefine(queue){
  let idx=0,step='size';
  const draw=body=>{
    const it=state.items.find(i=>i.k===queue[idx]);
    if(!it){if(++idx<queue.length){step='size';return draw(body)}closeSheet();update();toast('הרשימה מוכנה ✓');return}
    const [tn,emo]=TYPES[it.t];const groups=sizeGroups(it.t,it.bh);
    if(step==='size'&&groups.length<2)step='prod';
    const head=`<div class="rfhead"><span class="ico" aria-hidden="true">${emo}</span><div><b>${esc(it.bh?tn+' '+it.bh:tn)}</b>${it.q>1?` <span class="sub">× ${it.q}</span>`:''}<div class="sub">${idx+1} מתוך ${queue.length}</div></div></div>`;
    const tail=`<div class="row2 spread"><button class="link" type="button" id="rfSkip">דלג ←</button><button class="link" type="button" id="rfAll">לא משנה לי בשום מוצר, השווה לפי הזול</button></div>`;
    if(step==='size'){
      body.innerHTML=`${head}<h3>איזה גודל?</h3><div class="rfgrid">${groups.map(g=>`<button type="button" class="rfopt" data-sz="${esc(g.k)}"><b>${esc(g.k)}</b><small>מ-${fmt(g.min)} · ${g.n} אפשרויות</small></button>`).join('')}</div>
        <button type="button" class="rfopt any" data-sz=""><b>לא משנה לי</b><small>הכי זול בכל רשת</small></button>${tail}`;
      body.querySelectorAll('[data-sz]').forEach(b=>b.onclick=()=>{const k=b.dataset.sz;if(!k){delete it.sz;idx++;step='size';save();return draw(body)}it.sz=k;step='prod';save();draw(body)});
    }else{
      const vs=ofType(it.t).filter(v=>allowed(v)&&(!it.sz||sizeKey(v)===it.sz)&&(!it.bh||v.b===it.bh)).map(v=>({v,ch:cheapestOf(v.id)})).filter(x=>x.ch).sort((a,b)=>a.ch.p-b.ch.p);
      if(vs.length===1){it.v=vs[0].v.id;delete it.sz;delete it.bh;idx++;step='size';save();return draw(body)}
      const top=[],seen=new Set();for(const x of vs){const k=norm(vLabel(x.v));if(seen.has(k))continue;seen.add(k);top.push(x);if(top.length>=8)break}
      body.innerHTML=`${head}<h3>${it.sz?esc(it.sz)+' · ':''}איזה מוצר?</h3>
        <button type="button" class="rfopt any" id="rfCheap"><b>כל מותג, הכי זול${it.sz?' בגודל הזה':''}</b><small>נשווה את הזול בכל רשת</small></button>
        <div class="rflist">${top.map(({v,ch})=>`<button type="button" class="rfprod" data-rv="${v.id}">${thumb(v,TYPES[v.t][1],'thv')}<span class="grow"><b>${esc(vLabel(v))}</b><small>${esc(v.s||'')}</small></span><span class="num">${fmt(ch.p)}<small>ב${ch.c.short}</small></span></button>`).join('')}</div>
        ${vs.length>top.length?`<button class="link" type="button" id="rfMore">עוד ${vs.length-top.length} אפשרויות…</button>`:''}
        ${groups.length>=2?'<button class="link" type="button" id="rfBack">→ חזרה לבחירת גודל</button>':''}${tail}`;
      $('rfCheap').onclick=()=>{idx++;step='size';save();draw(body)};
      body.querySelectorAll('[data-rv]').forEach(b=>b.onclick=()=>{it.v=b.dataset.rv;delete it.sz;delete it.bh;idx++;step='size';save();draw(body)});
      if($('rfMore'))$('rfMore').onclick=()=>{closeSheet();update();openPicker(it.k)};
      if($('rfBack'))$('rfBack').onclick=()=>{delete it.sz;step='size';draw(body)};
    }
    $('rfSkip').onclick=()=>{idx++;step='size';draw(body)};
    $('rfAll').onclick=()=>{closeSheet();update()};
    setTimeout(()=>body.querySelector('.rfopt,.rfprod')?.focus(),30);
  };
  openSheet('בוא נדייק את הרשימה','',draw);
}
/* products the parser did not recognise: offer the closest real products by shared words */
function suggestFor(line,n=4){
  const words=norm(line).replace(/\(\d+\)/g,'').split(/[\s,.\-/]+/).filter(w=>w.length>=2);if(!words.length)return [];
  let res=[];for(const v of V){const key=(v.key??=norm(TYPES[v.t][0]+' '+v.b+' '+v.n+' '+v.s+(v.own?' מותג הבית':'')));let sc=0;for(const w of words)if(key.includes(w))sc+=w.length>=3?2:1;if(sc)res.push({v,sc})}
  if(!res.length)return [];const max=Math.max(...res.map(x=>x.sc));
  res=res.filter(x=>x.sc>=Math.max(2,max-1)).map(x=>({...x,ch:cheapestOf(x.v.id)})).filter(x=>x.ch).sort((a,b)=>(b.sc-a.sc)||(a.ch.p-b.ch.p));
  const out=[],seen=new Set();for(const x of res){const k=norm(vLabel(x.v));if(seen.has(k))continue;seen.add(k);out.push(x);if(out.length>=n)break}return out}
function unknownBox(unknown,addedKeys){
  const qOf=l=>{const m=l.match(/\((\d{1,2})\)/);return m?+m[1]:1};
  return `<div class="unkbox"><b>לא מצאנו בדיוק ${unknown.length===1?'מוצר אחד':unknown.length+' מוצרים'}. אולי התכוונת ל:</b>
    ${unknown.map((l,i)=>{const sg=suggestFor(l);return `<div class="unkitem"><div class="unkq">❓ ${esc(l)}</div>
      ${sg.length?`<div class="rflist">${sg.map(({v,ch})=>`<button type="button" class="rfprod" data-sg="${v.id}" data-q="${qOf(l)}">${thumb(v,TYPES[v.t][1],'thv')}<span class="grow"><b>${esc(vLabel(v))}</b><small>${esc(v.s||'')}</small></span><span class="num">${fmt(ch.p)}<small>ב${ch.c.short}</small></span></button>`).join('')}</div>`:'<div class="sub">לא מצאנו מוצר דומה.</div>'}
      <button class="link" type="button" data-sq="${esc(l.replace(/\(\d+\)/g,'').trim())}">🔍 חפש בעצמי</button></div>`}).join('')}
    <button class="btn big" type="button" id="unkDone">המשך ←</button></div>`;
}
function bindUnknown(root,addedKeys){
  root.querySelectorAll('[data-sg]').forEach(b=>b.onclick=()=>{const v=VB[b.dataset.sg];addItems([{t:v.t,v:v.id,q:+b.dataset.q||1}],'הצעה');save();render();
    const box=b.closest('.unkitem');box.innerHTML=`<div class="okline">✓ נוסף: ${esc(vLabel(v))}</div>`});
  root.querySelectorAll('[data-sq]').forEach(b=>b.onclick=()=>{const q=b.dataset.sq;closeSheet();update();const i=$('q');if(i){i.value=q;renderSearch(q);i.focus();i.scrollIntoView({block:'center'})}});
  const d=root.querySelector('#unkDone');if(d)d.onclick=()=>{closeSheet();update();refineQueue(addedKeys)};
}

/* ================= clubs and coupons =================
   Club deals come from the chains' promotion files (each promotion says whether it is for everyone or for
   club members). Membership and coupons are entered by the shopper: the chains have no public API to link
   a club account, so the app trusts what is entered and shows the code to use at checkout. */
const couponLive=k=>!k.used&&(!k.expires||k.expires>=new Date().toISOString().slice(0,10));
function couponFor(cid,sub){let best=null;
  for(const k of state.coupons||[]){if(!couponLive(k)||(k.chain&&k.chain!==cid)||sub<(+k.min||0))continue;
    const off=Math.min(sub,k.kind==='pct'?Math.round(sub*(+k.value||0))/100:(+k.value||0));if(off>0&&(!best||off>best.off))best={k,off}}
  return best}
const couponText=k=>k.kind==='pct'?`${k.value}% הנחה`:`${fmt(+k.value)} הנחה`;
function openClubs(){
  let adding=false,draft={chain:'',kind:'amount',value:'',min:'',code:'',expires:'',title:''},ctl=null;
  const draw=body=>{
    const today=new Date().toISOString().slice(0,10);
    const cps=(state.coupons||[]).slice().sort((a,b)=>couponLive(b)-couponLive(a));
    body.innerHTML=`<p class="sub">סמן באילו מועדונים אתה חבר. מחירי המועדון מגיעים מקבצי המבצעים שהרשתות מפרסמות, וייכנסו להשוואה רק ברשתות שסימנת.</p>

        if(!r||!(+r.value>0)){$('cpStatus').innerHTML='<div class="unk">לא מצאנו שובר בתמונה. אפשר למלא ידנית.</div>';return}

/* a deal from the price files: [kind 'm'|'p', n, price|pct, club, end, desc] */
function realDeal(d,cid){if(!Array.isArray(d))return null;const [k,n,val,club,end,desc,min,lim]=d;const lab=String(desc||'').trim();
  if(/קופון|הטבת|שובר|ביטוח/.test(lab))return null;/* needs a coupon or an outside benefit: not a shelf price */
  /* min: the deal needs a basket over min ₪ at that chain; lim: units per shopper */
  const base={club:!!club,end,label:'',min:+min>0?+min:0,lim:+lim>0?+lim:0};
  const cond=(base.min?` · בקנייה מעל ₪${Math.round(base.min)}`:'')+(base.lim?` · עד ${base.lim} יח׳`:'');
  if(k==='m'&&n>1)return{...base,kind:'multi',n,price:+val,label:(lab||`${n} ב-${fmt(+val)}`)+cond};
  if(k==='m')return{...base,kind:'fixed',price:+val,label:(lab||`מבצע ${fmt(+val)}`)+cond};
  if(k==='p')return{...base,kind:'pct',pct:(+val)/100,n:n||1,label:(lab||`${val}% הנחה`)+cond};
  return null}

function basketText(r){return `רשימת קניות ממוזיל (${r.c.short}):\n`+r.lines.map(L=>`${vLabel(VB[L.vid])} ${VB[L.vid].s} × ${L.q}`).join('\n')}
/* ================= payment methods =================

function tzOk(x){const d=String(x||'').replace(/\D/g,'');if(!d||d.length>9||/^0+$/.test(d))return false;const v=d.padStart(9,'0');let s=0;
  for(let i=0;i<9;i++){let k=(+v[i])*((i%2)+1);if(k>9)k-=9;s+=k}return s%10===0}

    ${x.def?'<span class="pill good">ברירת מחדל</span>':`<button class="link" type="button" data-pdef="${x.id}">ברירת מחדל</button>`}<button class="link" type="button" data-pdel="${x.id}" aria-label="החלף והסר את ${esc(x.type)} ${esc(x.last4||'')}">🔁 החלף</button></div>`).join(''):'<div class="empty">אין כרטיסים שמורים</div>'}
function removePay(id,redraw){const i=state.pays.findIndex(x=>x.id===id);if(i<0)return;const [x]=state.pays.splice(i,1);if(x.def&&cardsOf().length)cardsOf()[0].def=true;if(state.payCard===id)state.payCard=null;save();redraw();

function bindPayList(root,redraw){if(!root)return;

/* removing a payment method always puts another one in its place: a new card, or one already saved */
function openPayments(after,replaceId){if(typeof after==='function'&&!replaceId)after=after;let err='';const old=replaceId?state.pays.find(p=>p.id===replaceId):null;if(replaceId&&!old)replaceId=null;

/* Apple Pay on Apple devices, Google Pay elsewhere (Android, Chrome); both are offered so the shopper decides */

/* deals at or above minPct off the chain's own price, for the given chains */
function dealRows(chains,minPct=40){const rows=[];
  for(const v of V){if((!v.rd&&!v.rdc)||v.weighted)continue;for(const cid of chains){const p=v.rp[cid];if(p==null)continue;
    for(const d of [v.rd&&v.rd[cid],v.rdc&&v.rdc[cid]]){const pr=d&&realDeal(d,cid);if(!pr)continue;
      let unit=pr.kind==='multi'?pr.price/pr.n:pr.kind==='fixed'?pr.price:p*(1-pr.pct);
      const said=String(pr.label).match(/(\d{2})\s*%\s*(?:הנחה|הנ)|הנחה\s*(?:של\s*)?(\d{2})\s*%/);if(said)said[1]=said[1]||said[2];if(said&&pr.kind!=='pct')unit=p*(1-(+said[1])/100);
      const second=String(pr.label).match(/השני\s*ב[-\s]*(\d{2,3})\s*%/);if(second)unit=p*(1-(+second[1])/200);/* "the second at 50%" is 25% off each */
      const pct=Math.round((1-unit/p)*100);if(pct<minPct||pct>85)continue;
      if(/משלוח|מתנה|שקית|פיקדון|דמי|כרטיס|גיפט/.test(v.n))continue;
      rows.push({v,cid,pr,p,unit,pct,key:v.id+'|'+cid+'|'+(pr.end||'')+'|'+Math.round(unit*100)})}}}
  return rows}

/* ================= is this deal real? =================
   Now: the deal price against the regular price of the same barcode at every other chain, and the "before" price
   against what others charge (an inflated "before" makes the discount look bigger than it is).
   With history (hist/NN.json, one entry per regular-price change, from the price job): "lowest in N days" and
   "the regular price went up just before the deal". History is used once it covers at least 3 weeks. */
function dealCheck(r){const v=r.v,others=Object.entries(v.rp||{}).filter(([c,p])=>c!==r.cid&&p>0&&CHB[c]);if(!others.length)return null;
  const [mc,mp]=others.reduce((a,b)=>b[1]<a[1]?b:a);const ps=others.map(o=>o[1]).sort((a,b)=>a-b),med=ps[Math.floor(ps.length/2)];
  if(mp<=r.unit+0.005)return {cls:'warn',t:`ב${CHB[mc].short} זה ${fmt(mp)} גם בלי מבצע`};
  if(others.length>=2&&r.p>med*1.25)return {cls:'warn',t:`המחיר "לפני" גבוה ב-${Math.round((r.p/med-1)*100)}% מהרגיל ברשתות אחרות`};
  return {cls:'good',t:`הכי זול מ-${nOf(others.length+1,'רשת אחת','רשתות')} שמוכרות אותו`}}
let HIST_IX=null;const histIx=()=>HIST_IX||(HIST_IX=fetch('hist/index.json').then(r=>r.ok?r.json():null).catch(()=>null));
const _histC=new Map();
function histOf(bc){if(!bc)return Promise.resolve(null);const n=Number(String(bc).slice(-4))%64;
  if(!_histC.has(n))_histC.set(n,fetch(`hist/${String(n).padStart(2,'0')}.json`).then(r=>r.ok?r.json():{}).catch(()=>({})));
  return _histC.get(n).then(c=>c[bc]||null)}
async function histCheck(r){const ix=await histIx();if(!ix)return null;const today=ix.last,span=today-ix.first;if(span<21)return {cls:'info',t:`🕒 מעקב מחירים מ-${new Date(ix.first*864e5).toLocaleDateString('he-IL',{day:'numeric',month:'numeric'})}`};
  const h=await histOf(r.v.bc);if(!h)return null;const L=h[r.cid]||[];
  /* the regular price went up in the 45 days before the deal: the "discount" is partly the raise */
  for(let i=L.length-1;i>0;i--){if(today-L[i][0]>45)break;if(L[i-1][1]<r.p*0.92&&Math.abs(L[i][1]-r.p)<0.01)return {cls:'warn',t:`⚠️ המחיר הרגיל עלה מ-${fmt(L[i-1][1])} לפני ${nOf(today-L[i][0],'יום','ימים')}`}}
  const win=Math.min(90,span);let min=Infinity;for(const [c,E] of Object.entries(h)){for(let i=0;i<E.length;i++){const end=i+1<E.length?E[i+1][0]:today+1;if(end>today-win)min=Math.min(min,E[i][1])}}
  if(r.unit<min-0.005)return {cls:'good',t:`📉 המחיר הכי נמוך ב-${win} הימים האחרונים`};return null}
/* ================= the better-value pack =================
   Same product line (same kind, the name without its size), another size: if the price per kilo / litre / unit is
   clearly lower in a bigger pack (at most 4 times the size), the list says so and offers the switch. */
function qtyOf(v){const m=String(v&&v.s||'').match(/^([\d.,]+)\s*(גרם|ק״ג|מ״ל|ליטר|יח׳)$/);if(!m)return null;const n=parseFloat(m[1].replace(',','.'));if(!(n>0))return null;
  return {g:{n,k:'g',u:'ק״ג',per:1000},'ק״ג':{n:n*1000,k:'g',u:'ק״ג',per:1000},'מ״ל':{n,k:'ml',u:'ליטר',per:1000},'ליטר':{n:n*1000,k:'ml',u:'ליטר',per:1000},'יח׳':{n,k:'u',u:'יח׳',per:1}}[m[2]==='גרם'?'g':m[2]]}
/* the name without its size: every other word (and percentages like "3% שומן") must match */
const lineKey=v=>norm(String(v.n).replace(/[\d.,]+\s*(?:גרם|גר'|גר|ג'|ג׳|ג|ק״ג|קג|ק"ג|קילו|מ״ל|מ"ל|מל|ליטר|ל'|ל׳|יח׳|יח'|יחידות|יח)(?![\p{L}])/gu,' ')).replace(/[^\p{L}\p{N}%]+/gu,' ').trim();
let _packIx=null,_packKey='',_packFam=null,_packN=0;
function packHint(v){if(!v||!v.real||v.weighted)return null;const q=qtyOf(v);if(!q)return null;
  const key=(REAL&&REAL.updated)+'|'+state.follow.join(',');if(_packKey!==key){_packIx=new Map();_packKey=key}
  /* one pass over the catalog builds the product lines (again only when the catalog grows) */
  if(!_packFam||_packN!==V.length){_packFam=new Map();_packN=V.length;_packIx=new Map();for(const x of V){if(!x.real||x.weighted||!qtyOf(x))continue;const k=x.t+'|'+lineKey(x);let L=_packFam.get(k);if(!L)_packFam.set(k,L=[]);L.push(x)}}
  const lk=v.t+'|'+lineKey(v);let fam=_packIx.get(lk);
  if(!fam){fam=(_packFam.get(lk)||[]).map(x=>{const qx=qtyOf(x),c=cheapestOf(x.id);return qx&&c?{x,q:qx,c,pu:c.p/qx.n}:null}).filter(Boolean);_packIx.set(lk,fam)}
  const me=fam.find(f=>f.x.id===v.id);if(!me)return null;
  let best=null;for(const f of fam){if(f.x.id===v.id||f.q.k!==q.k||f.q.n<=q.n||f.q.n>q.n*4)continue;if(f.pu<me.pu*0.9&&(!best||f.pu<best.pu))best=f}

  const [v,one,many]=T.find(t=>all>=t[0]*1.5)||T[T.length-1];const n=Math.floor(all/v);

  <section class="card"><h2>🏪 רשתות ומועדוני לקוחות</h2><p class="sub">אפשר להזמין דרך מוזיל מכל רשת פעילה. סמן מועדונים שאתה חבר בהם כדי לקבל את מחירי המועדון בהשוואה.</p>

    <p class="sub">בקרוב: טיב טעם, מחסני השוק, קשת טעמים, סופר ספיר ועוד.</p></section>
  <section class="card"><h2>🔔 התראות</h2>
    <div class="toggle"><label for="ndrops">ירידות מחיר במוצרים שאני קונה</label><input type="checkbox" id="ndrops" ${state.notif.drops?'checked':''}></div>
    <div class="toggle"><label for="nsched">תזכורת לפני קנייה מתוזמנת</label><input type="checkbox" id="nsched" ${state.notif.sched?'checked':''}></div>
    <div class="toggle"><label for="nsound">🔊 צליל "ביפ" בסריקת מוצר</label><input type="checkbox" id="nsound" ${state.sound!==false?'checked':''}></div>
    <div class="toggle"><label for="nmega">🚨 מבצעי שובר שוק (הנחות של עשרות אחוזים)</label><input type="checkbox" id="nmega" ${state.notif.mega?'checked':''}></div></section>
  <section class="card"><h2>🔒 פרטיות ותנאים</h2>
    <div class="row2"><button class="btn sm ghost" type="button" data-legal="privacy">מדיניות פרטיות</button><button class="btn sm ghost" type="button" data-legal="terms">תנאי שימוש</button><button class="btn sm ghost" type="button" id="resetAll">איפוס נתוני ההדגמה</button></div></section>`;
  const bindP=(id,key)=>{$(id).onchange=e=>{state.profile[key]=e.target.value;save();toast('נשמר')}};
  $('openLoc').onclick=openLocation;$('openClubs').onclick=openClubs;
  $('priceFile').onchange=async e=>{const f=e.target.files&&e.target.files[0];e.target.value='';if(!f)return;const st=$('priceStatus');
    try{const kept=await loadPriceFile(f,t=>{st.textContent=t});render();toast(`נטענו ${REAL.count.toLocaleString('he-IL')} מוצרים עם מחירים אמיתיים`);
      if(!kept)setTimeout(()=>toast('שים לב: המכשיר לא שמר את הקובץ, ובפתיחה הבאה תצטרך לטעון אותו שוב.'),2200)}
    catch(err){st.innerHTML=`<div class="unk">${esc(err.message||'טעינת הקובץ נכשלה.')}</div>`}};
  if($('useBundled'))$('useBundled').onclick=()=>{state.demoOnly=false;save();location.reload()};
  if($('dropReal'))$('dropReal').onclick=e=>{const b=e.currentTarget;if(!b.dataset.armed){b.dataset.armed=1;b.textContent='בטוח? לחץ שוב';b.classList.add('red');return}
    dropReal();state.real=null;state.demoOnly=true;idbDel('summary');cleanState();update();toast('חזרת לנתוני הדגמה')};
  $('premBtn').onclick=()=>{state.premium=!state.premium;update();toast(state.premium?'ברוך הבא לפרימיום (הדגמה)':'המנוי בוטל')};
  if($('regOpen'))$('regOpen').onclick=()=>openRegister();if($('regEdit'))$('regEdit').onclick=()=>openRegister();
  $('pkosher').onchange=e=>{P.kosher=e.target.value;update()};$('pgf').onchange=e=>{P.gf=e.target.checked;update()};$('pveg').onchange=e=>{P.vegan=e.target.checked;update()};
  $('screen').querySelectorAll('[data-noown]').forEach(b=>b.onchange=()=>{const t=b.dataset.noown;P.noOwn=b.checked?[...P.noOwn,t]:P.noOwn.filter(x=>x!==t);save();b.closest('details').querySelector('summary').textContent=`לא להציע מותג הבית במוצרים מסוימים (${P.noOwn.length})`});
  $('payManage').onclick=()=>openPayments();bindPayList($('payList'),()=>render());
  $('screen').querySelectorAll('[data-club]').forEach(b=>b.onchange=()=>{const id=b.dataset.club;state.clubs=b.checked?[...state.clubs,id]:state.clubs.filter(x=>x!==id);save();toast(b.checked?'מחירי המועדון ייכללו בהשוואה':'הוסר מהמועדון')});
  $('screen').querySelectorAll('[data-follow]').forEach(b=>b.onchange=()=>{const id=b.dataset.follow;
    if(b.checked)state.follow.push(id);else{if(state.follow.length<=1){b.checked=true;toast('צריך לפחות רשת אחת');return}state.follow=state.follow.filter(x=>x!==id)}save()});
  $('ndrops').onchange=e=>{state.notif.drops=e.target.checked;save()};$('nsched').onchange=e=>{state.notif.sched=e.target.checked;save()};$('nmega').onchange=e=>{state.notif.mega=e.target.checked;update()};
  $('nsound').onchange=e=>{state.sound=e.target.checked;save();if(state.sound){unlockBeep();beep()}};
  $('screen').querySelectorAll('[data-legal]').forEach(b=>b.onclick=()=>{const [t,body]=LEGAL[b.dataset.legal];openSheet(t,body)});
  accordion($('screen'));
  $('resetAll').onclick=e=>{const b=e.target;if(b.dataset.armed){const r=state.real;state=seed();state.real=r;cleanState();update();toast('נתוני ההדגמה אופסו')}else{b.dataset.armed=1;b.textContent='בטוח? לחץ שוב';b.classList.add('red')}};
}

/* ================= nav ================= */
const TABS=[['basket','🛒','הרשימה'],['deals','🔥','מבצעים'],['feed','🎬','מתכונים'],['mine','📁','שמורים'],['account','👤','חשבון']];
/* saved lists and past orders share one tab with a two-way switch */
function renderMine(){(state.mine==='orders'?renderOrders:renderLists)();
  $('screen').insertAdjacentHTML('afterbegin',`<div class="seg" role="tablist" aria-label="מה להציג">${[['lists','📝 רשימות שמורות'],['orders','🧾 הזמנות קודמות']].map(([k,l])=>`<button type="button" role="tab" data-mine="${k}" aria-selected="${state.mine===k}">${l}</button>`).join('')}</div>`);
  $('screen').querySelectorAll('[data-mine]').forEach(b=>b.onclick=()=>{state.mine=b.dataset.mine;update()});}
function openAbout(){openSheet('על המחירים',`<p>${REAL?`המחירים אמיתיים, מקבצי השקיפות שהרשתות מפרסמות לפי חוק. ${REAL.count.toLocaleString('he-IL')} מוצרים מ-${nOf(REAL.chains.length,'רשת אחת','רשתות')}. עודכנו ${agoText(REAL.updated)||'(תאריך לא ידוע)'}.`:'כרגע מוצגים מחירים לדוגמה.'}</p>
  <p>המחיר שמוצג הוא המחיר שרוב הסניפים של הרשת גובים. אם בחרת סניף, מוצגים המחירים של הסניף הזה. המבצעים אמיתיים מקבצי הרשתות. דמי המשלוח לפי מה שהרשתות פרסמו (נבדק ב${FEES_CHECKED}). זמני המשלוח והכשרות עדיין לדוגמה.</p><p>הסניף הקרוב נקבע לפי מיקומי רחובות וסניפים מ-OpenStreetMap (© OpenStreetMap contributors, ODbL), לפי מרכז הרחוב.</p><p><b>הזמנה:</b> מוזיל לא גובה כסף. בוחרים רשת, הרשימה מועתקת, והאתר של הרשת נפתח כדי להזמין ולשלם שם.</p>`)}
function go(t){state.tab=t;update();window.scrollTo(0,0)}

function render(){if(!state.dealsN)state.dealsN=20;
  $('demoLine').innerHTML=(REAL?`✅ מחירים אמיתיים · עודכנו ${agoText(REAL.updated)||''}`:'מחירים לדוגמה')+' · <u>מה זה?</u>';$('demoLine').onclick=openAbout;
  if(state.tab!=='basket'){$('bestbar').hidden=true;$('bestbar').innerHTML='';document.documentElement.classList.remove('hasbar')}
  document.documentElement.classList.toggle('big',!!state.big);
  $('locBtn').textContent='📍 '+(state.profile.street?streetLine()+', ':state.nb&&!GENERIC_AREAS.includes(state.nb)?state.nb+', ':'')+state.city;$('locBtn').setAttribute('aria-label','מיקום: '+locText()+'. לחץ לשינוי');$('locBtn').onclick=openLocation;
  const unseen=state.notif.mega?followedMega().filter(m=>!state.seenMega.includes(megaId(m))).length:0;
  $('bellN').hidden=!unseen;$('bellN').textContent=unseen;$('bellBtn').onclick=openMegaSheet;
  $('premTag').innerHTML=state.premium?'<span class="prem">⭐ פרימיום</span>':'';
  $('nav').innerHTML=TABS.map(([k,e,l])=>`<button type="button" data-tab="${k}" ${state.tab===k?'aria-current="page"':''}><span class="e" aria-hidden="true">${e}</span>${l}${k==='basket'&&state.items.length?`<span class="badge num">${state.items.length}</span>`:''}</button>`).join('');
  $('nav').querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>go(b.dataset.tab));
  ({basket:renderBasket,deals:renderDeals,feed:renderFeed,mine:renderMine,account:renderAccount}[state.tab]||renderBasket)();
}
async function refreshPrices(){try{const v=await (await fetch('version.json',{cache:'no-store'})).json();if(!v||!v.updated||!REAL||v.updated===REAL.updated)return;
  const r=await fetch('prices.json',{cache:'no-cache'});if(!r.ok)return;const sum=await r.json();if(sum.updated===REAL.updated)return;
  applyReal(sum);REAL.source='bundled';state.real={updated:REAL.updated,count:REAL.count,chains:REAL.chains,source:'bundled'};_brFiles.clear();_mem.clear();LOADING.clear();for(const k in BR)delete BR[k];
  snapshotReal();cleanState();save();render();ensureChains();ensureBranches();toast('המחירים עודכנו לגרסה החדשה')}catch(e){}}
/* boot: if real prices were loaded before, bring them back before the first render (saved items point at real products) */
/* ================= chain logos =================
   Each chain's own site icon (its apple-touch-icon, else its favicon), shown in the round chain badge for identification.
   Loaded from the chain's website at run time, never redrawn or stored here; until it loads, or when it cannot
   (no website on file, the site blocks it, offline), the badge keeps the chain's colour and initials. */
function chainLogos(){if(chainLogos.done)return;chainLogos.done=true;const css=[];let st=null;
  const add=(c,src)=>{const v=`var(${c.c})`;css.push(`.av[style*="${v})"],.av[style*="${v};"],[style*="--sc:${v}"] .av:not([style*="--sc:"]){background:#fff url("${src}") center/72% no-repeat;color:transparent;box-shadow:inset 0 0 0 1.5px var(--line)}`);
    if(!st){st=document.createElement('style');st.id='chainLogos';document.head.appendChild(st)}st.textContent=css.join('\n')};
  for(const c of CH){if(!c.url)continue;let origin;try{origin=new URL(c.url).origin}catch(e){continue}
    const tries=[origin+'/apple-touch-icon.png',origin+'/favicon.ico'];
    const next=i=>{if(i>=tries.length)return;const im=new Image();im.referrerPolicy='no-referrer';
      im.onload=()=>{if(im.naturalWidth>=16)add(c,tries[i]);else next(i+1)};im.onerror=()=>next(i+1);im.src=tries[i]};
    next(0)}}
/* the splash leaves once the prices are in (at least ~1.6 s, at most ~5 s, or at a tap); while it waits it counts what is being compared */
(function splash(){const el=document.getElementById('splash');if(!el)return;const t0=Date.now();let shown=0;
  const bye=()=>{if(el.classList.contains('out'))return;el.classList.add('out');setTimeout(()=>el.remove(),500);setTimeout(()=>{try{firstRun()}catch(e){}},250)};
  el.addEventListener('click',bye);
  const tick=()=>{if(!document.contains(el))return;const real=typeof REAL!=='undefined'&&REAL&&REAL.count;
    const f=document.getElementById('sfacts');
    if(real&&f){const n=REAL.count,ch=(REAL.chains||[]).length||(typeof CH!=="undefined"?CH.length:0);shown=Math.min(n,Math.round(shown+Math.max(n/12,1)));f.textContent=`משווה ${shown.toLocaleString('he-IL')} מוצרים · ${ch} רשתות`}
    const el2=Date.now()-t0;if((real&&shown>=REAL.count&&el2>1600)||el2>5000)return setTimeout(bye,real?350:0);setTimeout(tick,60)};
  tick()})();
/* ================= phone notifications (the Android app) =================
   Local notifications through Capacitor: when the app opens it tells about a price drop on a watched product, new deals at
   chains with alerts on, and deals on what this shopper buys; and it schedules "ends tomorrow" for deals on products in the
   list, which arrive even when the app is closed. (Alerts while the app stays closed for days need a push server: Firebase.) */
const LN=()=>window.Capacitor?.Plugins?.LocalNotifications||null;
const nid32=s=>{let h=0;for(const ch of String(s))h=(h*31+ch.charCodeAt(0))|0;return Math.abs(h)%2000000000+1};
async function pushSync(){const L=LN();if(!L||!state.pushOn||!REAL)return;
  try{const pr=await L.checkPermissions();if(pr.display!=='granted')return}catch(e){return}
  const sent=state.pushSent||(state.pushSent={});const now=Date.now();for(const k in sent)if(now-sent[k]>30*864e5)delete sent[k];
  const msgs=[];
  for(const d of priceDrops().slice(0,2)){const k='d|'+d.v.id+'|'+Math.round(d.to*100);if(sent[k])continue;sent[k]=now;msgs.push({title:'📉 ירד המחיר',body:`${vLabel(d.v)}: ${fmt(d.to)} ב${d.c.short} (היה ${fmt(d.from)})`,k})}
  {const rows=chainAlertDeals(true).filter(r=>!sent['c|'+r.key]);if(rows.length){rows.forEach(r=>sent['c|'+r.key]=now);const by={};rows.forEach(r=>(by[r.cid]||=[]).push(r));
    for(const [cid,R] of Object.entries(by).slice(0,2))msgs.push({title:`🔥 ${nOf(R.length,'מבצע חדש','מבצעים חדשים')} ב${CHB[cid].short}`,body:R.slice(0,3).map(r=>`${vLabel(r.v)} −${r.pct}%`).join(' · '),k:'c|'+cid})}}
  {const mt=myTypes();if(mt.size){const rows=dealRows(followed().map(c=>c.id),30).filter(r=>mt.has(r.v.t)&&(!r.pr.club||state.clubs.includes(r.cid))&&!sent['m|'+r.key]).sort((a,b)=>b.pct-a.pct).slice(0,3);
    if(rows.length){rows.forEach(r=>sent['m|'+r.key]=now);msgs.push({title:'🛒 במבצע ממה שאתה קונה',body:rows.map(r=>`${vLabel(r.v)} −${r.pct}% ב${CHB[r.cid].short}`).join(' · '),k:'m|'+rows[0].key})}}}
  const at=[];/* deals on products in the list that end tomorrow: a reminder at 10:00 the day before */
  {const ids=new Set(state.items.map(i=>i.v).filter(Boolean)),best=new Map();if(ids.size)for(const r of dealRows(followed().map(c=>c.id),10)){if(!ids.has(r.v.id)||!r.pr.end)continue;const o=best.get(r.v.id);if(!o||r.unit<o.unit)best.set(r.v.id,r)}
  /* one reminder per product: its best deal, when it ends within two weeks */
  for(const r of best.values()){const when=new Date(new Date(r.pr.end+'T10:00:00').getTime()-864e5);const k='e|'+r.key;if(when.getTime()<=now||when.getTime()>now+14*864e5||sent[k])continue;sent[k]=now;
    at.push({id:nid32(k),title:'⏰ המבצע נגמר מחר',body:`${vLabel(r.v)} ב${CHB[r.cid].short}: ${fmt(r.unit)} במקום ${fmt(r.p)}`,schedule:{at:when}})}}
  const list=[...msgs.slice(0,3).map(m=>({id:nid32(m.k+now),title:m.title,body:m.body})),...at.slice(0,10)];
  if(list.length){try{await L.schedule({notifications:list})}catch(e){}}save()}
async function pushToggle(on){const L=LN();if(!L)return;if(on){let pr;try{pr=await L.requestPermissions()}catch(e){pr=null}
    if(!pr||pr.display!=='granted'){state.pushOn=false;save();update();toast('לא אושרו התראות. אפשר להפעיל אותן בהגדרות הטלפון');return}
    state.pushOn=true;save();update();toast('🔔 התראות לטלפון פועלות');pushSync()}else{state.pushOn=false;save();update();toast('התראות לטלפון כבויות')}}
(async function boot(){setTimeout(()=>{try{chainLogos()}catch(e){}},1500);setTimeout(()=>{pushSync().catch(()=>{})},8000);
  $('screen').innerHTML='<div class="empty">טוען מחירים אמיתיים…</div>';
  let loaded=false;
  if(state.real&&state.real.source!=='bundled'){try{const sum=await idbGet('summary');if(sum){applyReal(sum);REAL.source='file';loaded=true}}catch(e){}}
  if(!loaded&&!state.demoOnly){
    // the phone keeps the last price file: open with it at once, then check in the background whether a newer one was published
    try{const c=await idbGet('bundledV');if(restoreReal(c)){REAL.source='bundled';loaded=true;setTimeout(refreshPrices,800)}}catch(e){}
    if(!loaded){try{const r=await fetch('prices.json',{cache:'no-cache'});if(r.ok){const sum=await r.json();applyReal(sum);REAL.source='bundled';loaded=true;snapshotReal()}}catch(e){}}}
  if(!_fromLS){try{const j=await idbGet('state');const s=j&&JSON.parse(j);if(s&&s.v===4&&Array.isArray(s.items))state={...state,...s,real:state.real}}catch(e){}}
  state.real=loaded?{updated:REAL.updated,count:REAL.count,chains:REAL.chains,source:REAL.source}:null;
  cleanState();save();render();if(loaded)loadSG().catch(()=>{});/* also places branches whose file names no city */ensureChains();ensureBranches();
})();
</script>
